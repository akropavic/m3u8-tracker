
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANLI YAYIN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: 45px auto;
    padding: 20px;
}

h1 {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 25px;
}

.channels {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.channels button {
    background: #191919;
    color: #aaa;
    border: 1px solid #292929;
    padding: 15px 5px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 5px;
}

.channels button:hover,
.channels button.active {
    background: #e32636;
    color: white;
    border-color: #e32636;
}

.player {
    background: #000;
    border: 1px solid #252525;
    border-radius: 5px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

.status {
    color: #777;
    font-size: 12px;
    margin-top: 12px;
}

@media(max-width: 550px) {
    .container {
        margin: 20px auto;
        padding: 12px;
    }

    .channels button {
        font-size: 12px;
        padding: 13px 2px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>CANLI YAYIN</h1>

    <div class="channels">
        <button onclick="playChannel(0)" id="btn0">BEIN 1</button>
        <button onclick="playChannel(1)" id="btn1">BEIN 2</button>
        <button onclick="playChannel(2)" id="btn2">BEIN MAX 1</button>
        <button onclick="playChannel(3)" id="btn3">BEIN MAX 2</button>
    </div>

    <div class="player">
        <video id="video" controls playsinline></video>
    </div>

    <div class="status" id="status">Yayın seçiniz.</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

// GitHub stream.txt adresini buraya yaz
const STREAM_URL = "https://raw.githubusercontent.com/akropavic/m3u8-tracker/refs/heads/main/stream.txt";

const CHANNELS = [
    "BIRINCI SINIF",
    "IKINCI SINIF",
    "UCUNCU SINIF",
    "DORDUNCU SINIF"
];

const video = document.getElementById("video");
const statusText = document.getElementById("status");

let hls = null;

async function getStreams() {

    const response = await fetch(
        STREAM_URL + "?t=" + Date.now(),
        { cache: "no-store" }
    );

    if (!response.ok) {
        throw new Error("Yayın listesi alınamadı.");
    }

    const text = await response.text();
    const lines = text.split(/\r?\n/);

    const streams = {};
    let current = null;

    for (const line of lines) {
        const value = line.trim();

        if (value.startsWith("#")) {
            current = value.substring(1).trim();
            streams[current] = [];
        } else if (current && value.startsWith("http")) {
            streams[current].push(value);
        }
    }

    return streams;
}

async function playChannel(index) {

    document.querySelectorAll(".channels button")
        .forEach(button => button.classList.remove("active"));

    document.getElementById("btn" + index)
        .classList.add("active");

    statusText.textContent = "Yayın yükleniyor...";

    try {

        const streams = await getStreams();
        const links = streams[CHANNELS[index]];

        if (!links || !links.length) {
            throw new Error("Bu kanalda yayın bulunamadı.");
        }

        const streamUrl = links[0];

        if (hls) {
            hls.destroy();
            hls = null;
        }

        video.pause();
        video.removeAttribute("src");
        video.load();

        if (video.canPlayType("application/vnd.apple.mpegurl")) {

            video.src = streamUrl;
            await video.play();

        } else if (Hls.isSupported()) {

            hls = new Hls();

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, async () => {
                try {
                    await video.play();
                    statusText.textContent = "Yayın oynatılıyor.";
                } catch {
                    statusText.textContent = "Oynatmak için Play tuşuna basın.";
                }
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusText.textContent = "Yayın bağlantısı hatası.";
                }
            });

        } else {
            throw new Error("Tarayıcı HLS desteklemiyor.");
        }

        statusText.textContent = "Yayın yükleniyor...";

    } catch (error) {
        statusText.textContent = error.message;
    }
}

</script>

</body>
</html>
